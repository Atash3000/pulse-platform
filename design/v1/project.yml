# xcodegen spec for the standalone v1 design preview app.
# Regenerate the .xcodeproj anytime with:  cd design/v1 && xcodegen generate
name: PulseDesign
options:
  bundleIdPrefix: com.design.pulsev1
  deploymentTarget:
    iOS: "17.0"
targets:
  PulseDesign:
    type: application
    platform: iOS
    sources:
      - path: PulseDesignSystem.swift
      - path: PulseHomeView.swift
      - path: PulseMenuView.swift
      - path: PulseRootView.swift
      - path: .preview/PulseDesignApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.design.pulsev1.preview
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
